<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ Music System</title>
  </head>

  <body>
    <h1>DJ Music System</h1>
  <h2>Register</h2>
    <form id="registerForm">
      <input type="email" id="registerEmail" placeholder="Email" required />
      <input
        type="password"
        id="registerPassword"
        placeholder="Password"
        required
      />
      <button type="submit">Register</button>
    </form>
    <h2>Login</h2>
    <form id="loginForm" method="post">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required
      />
      <button type="submit">Login</button>
    </form>
    <h2>Musicas</h2>
    <button id="getMusicasBtn">Obter Musicas</button>
    <ul id="musicasList"></ul>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("registerEmail").value;
          const password = document.getElementById("registerPassword").value;
          const response = await fetch("https://dj-music-system.onrender.com/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (response.ok) {
            alert(data.message);
          } else {
            alert(data.error);
          }
        });

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value;
          const password = document.getElementById("loginPassword").value;
          const response = await fetch("https://dj-music-system.onrender.com/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();
          if (response.ok) {
            localStorage.setItem("token", data.token);
            alert(data.message);
          } else {
            alert(data.error);
          }
        });

      document
        .getElementById("getMusicasBtn")
        .addEventListener("click", async () => {
          const token = localStorage.getItem("token");
          if (!token) {
            return alert("Por favor, faça login primeiro!");
          }
          const response = await fetch("https://dj-music-system.onrender.com/musicas", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const musicas = await response.json();
          if (response.ok) {
            const musicasList = document.getElementById("musicasList");
            musicasList.innerHTML = "";
            musicas.forEach((musica) => {
              const li = document.createElement("li");
              li.textContent = `${musica.titulo} - ${musica.artista}`;
              musicasList.appendChild(li);
            });
          } else {
            alert(musicas.error);
          }
        });
    </script>
  </body>
</html>
